<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>10週健美訓練紀錄</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e24;
      --primary: #facc15; /* 經典鐵館金 */
      --primary-dim: rgba(250, 204, 21, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    /* 頂部標題 */
    .header {
      padding: 20px 20px 10px;
      text-align: center;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { margin: 0; font-size: 22px; color: var(--primary); letter-spacing: 1px; }

    /* 內容區域 */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 80px; /* 留位給底部導航 */
    }

    /* 卡片與通用樣式 */
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .card-title { font-size: 18px; margin: 0 0 15px 0; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
    .card-title::before { content: ""; display: inline-block; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

    /* 週期進度條 */
    .cycle-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-sub); }
    .progress-bar { width: 100%; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 20px;}
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }

    /* 表單與輸入 */
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-sub); }
    input, select, textarea {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 16px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    /* 按鈕 */
    .btn {
      width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .btn-primary { background: var(--primary); color: #000; box-shadow: 0 4px 15px var(--primary-dim); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }

    /* 訓練組數紀錄列 */
    .set-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; }
    .set-row input { text-align: center; padding: 10px; }
    .del-btn { background: transparent; border: none; color: var(--danger); font-size: 20px; padding: 5px; cursor: pointer; }

    /* 歷史紀錄清單 */
    .history-item { border-bottom: 1px solid var(--border); padding: 15px 0; }
    .history-item:last-child { border-bottom: none; }
    .h-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .h-title { font-weight: bold; font-size: 16px; }
    .h-date { font-size: 12px; color: var(--text-sub); }
    .h-details { font-size: 14px; color: #cbd5e1; }
    .h-badge { display: inline-block; background: var(--primary-dim); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px;}

    /* 底部導航欄 */
    .nav-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0 20px;
      z-index: 20;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      color: var(--text-sub); background: none; border: none; font-size: 12px; cursor: pointer; padding: 10px;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 22px; }

    /* 分頁顯示控制 */
    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  </style>
</head>
<body>

<div class="app-container">
  
  <div class="header">
    <h1 id="header-title">10 週訓練週期追蹤</h1>
  </div>

  <div class="content">
    
    <!-- 視圖 1：首頁 (Dashboard) -->
    <div id="view-home" class="view-section active">
      <div class="card">
        <h2 class="card-title">當前週期進度</h2>
        <div class="cycle-header">
          <span id="cycle-name-display">自然健美肌肥大週期</span>
          <span id="cycle-week-display">第 3 週 / 10 週</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="cycle-progress" style="width: 30%;"></div>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-secondary" style="padding: 8px; font-size: 14px;" onclick="adjustWeek(-1)">- 退一週</button>
          <button class="btn btn-secondary" style="padding: 8px; font-size: 14px;" onclick="adjustWeek(1)">+ 進一週</button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">今日訓練預覽</h2>
        <div style="color: var(--text-sub); margin-bottom: 15px;">今天是 <span id="today-day" style="color: var(--primary); font-weight:bold;">星期一</span></div>
        <div id="today-routine" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; font-size: 15px; line-height: 1.6;">
          載入中...
        </div>
        <button class="btn btn-primary" style="margin-top: 15px;" onclick="switchTab('record')">開始今日訓練</button>
      </div>
      
      <div class="card">
        <h2 class="card-title">近期紀錄</h2>
        <div id="recent-logs-preview"></div>
      </div>
    </div>

    <!-- 視圖 2：實戰紀錄 (Record) -->
    <div id="view-record" class="view-section">
      <div class="card">
        <h2 class="card-title">紀錄新訓練</h2>
        
        <div class="input-group">
          <label>訓練動作 (Exercise)</label>
          <input type="text" id="exercise-name" placeholder="例如：槓鈴深蹲, 臥推..." list="exercise-suggestions">
          <datalist id="exercise-suggestions">
            <option value="槓鈴深蹲">
            <option value="羅馬尼亞硬拉 (RDL)">
            <option value="槓鈴臥推">
            <option value="上斜啞鈴臥推">
            <option value="引體上升">
            <option value="啞鈴肩推">
          </datalist>
        </div>

        <div class="input-group">
          <label>輸入組數 (Sets)</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 5px; color: var(--text-sub); font-size: 12px; text-align: center;">
            <div>重量 (kg)</div>
            <div>次數 (Reps)</div>
            <div>RPE (可選)</div>
            <div></div>
          </div>
          <div id="sets-container">
            <!-- 組數列會在這裡動態生成 -->
          </div>
          <button class="btn btn-secondary" style="margin-top: 10px;" onclick="addSetRow()">+ 新增一組</button>
        </div>

        <div class="input-group">
          <label>備註 (狀態、補劑、感受)</label>
          <textarea id="workout-notes" rows="2" placeholder="例如：今日狀態佳，訓練前服用肌酸，發力順暢。"></textarea>
        </div>

        <button class="btn btn-primary" onclick="saveWorkout()">💾 儲存紀錄</button>
      </div>

      <div class="card">
        <h2 class="card-title">今日已完成</h2>
        <div id="today-logs"></div>
      </div>
    </div>

    <!-- 視圖 3：週期編排 (Plan) -->
    <div id="view-plan" class="view-section">
      <div class="card">
        <h2 class="card-title">每週課表編排</h2>
        <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 20px;">
          設定你每星期的固定訓練菜單。當完成 10 週週期後，可以重置並編排新的組合。
        </p>

        <div class="input-group">
          <label>選擇日子</label>
          <select id="plan-day-select" onchange="loadPlanForDay()">
            <option value="星期一">星期一</option>
            <option value="星期二">星期二</option>
            <option value="星期三">星期三</option>
            <option value="星期四">星期四</option>
            <option value="星期五">星期五</option>
            <option value="星期六">星期六</option>
            <option value="星期日">星期日</option>
          </select>
        </div>

        <div class="input-group">
          <label>該日訓練內容 (直接編輯)</label>
          <textarea id="plan-day-content" rows="4" placeholder="例如：&#10;1. 槓鈴深蹲 4組&#10;2. 腿舉 3組&#10;3. 坐姿腿彎舉 3組"></textarea>
        </div>
        <button class="btn btn-secondary" onclick="savePlanForDay()">儲存當日課表</button>
      </div>

      <div class="card" style="border-color: rgba(239, 68, 68, 0.3);">
        <h2 class="card-title" style="color: var(--danger);">週期管理</h2>
        <div class="input-group">
          <label>當前週期名稱</label>
          <input type="text" id="cycle-name-input" value="10週自然健美肌肥大週期">
        </div>
        <button class="btn btn-secondary" style="margin-bottom: 15px;" onclick="updateCycleName()">更新名稱</button>
        
        <button class="btn btn-danger" onclick="resetCycle()">⚠️ 結束當前週期 (重置進度與課表)</button>
      </div>
    </div>

  </div>

  <!-- 底部導航 -->
  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('home')" id="nav-home">
      <span class="nav-icon">📊</span>
      <span>首頁</span>
    </button>
    <button class="nav-item" onclick="switchTab('record')" id="nav-record">
      <span class="nav-icon">🏋️</span>
      <span>紀錄</span>
    </button>
    <button class="nav-item" onclick="switchTab('plan')" id="nav-plan">
      <span class="nav-icon">📅</span>
      <span>編排</span>
    </button>
  </div>

</div>

<script>
  // ================= 數據結構與初始化 =================
  const defaultData = {
    cycle: {
      name: "10週自然健美肌肥大週期",
      currentWeek: 1,
      maxWeeks: 10
    },
    routine: {
      "星期一": "1. 槓鈴臥推 (4x8-12)\n2. 上斜啞鈴臥推 (3x10)\n3. 坐姿划船 (4x10)\n4. 滑輪飛鳥 (3x15)",
      "星期二": "1. 槓鈴深蹲 (4x6-8)\n2. 羅馬尼亞硬拉 RDL (3x10)\n3. 腿舉 (3x12)\n4. 站姿提踵 (4x15)",
      "星期三": "積極恢復 / 休息\n(可補充 ZMA 幫助睡眠恢復)",
      "星期四": "1. 槓鈴肩推 (4x8)\n2. 引體上升 (4x力竭)\n3. 啞鈴側平舉 (4x15)",
      "星期五": "1. 硬拉 (3x5)\n2. 俯身划船 (4x8)\n3. 二頭彎舉 (3x12)\n4. 三頭下壓 (3x12)",
      "星期六": "弱點補強 / 核心訓練",
      "星期日": "完全休息"
    },
    logs: [] // 格式: { id, date, exercise, sets: [{weight, reps, rpe}], notes, cycleWeek }
  };

  let appData = JSON.parse(localStorage.getItem('hypertrophyApp')) || defaultData;

  // 取得今天的星期
  const daysMap = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  const todayDate = new Date();
  const todayDayStr = daysMap[todayDate.getDay()];
  const todayDateStr = todayDate.toISOString().split('T')[0];

  function saveData() {
    localStorage.setItem('hypertrophyApp', JSON.stringify(appData));
    renderAll();
  }

  // ================= 視圖切換 =================
  function switchTab(tabId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`nav-${tabId}`).classList.add('active');

    const titles = { home: "10 週週期追蹤", record: "實戰訓練紀錄", plan: "週期課表編排" };
    document.getElementById('header-title').innerText = titles[tabId];

    renderAll();
  }

  // ================= 渲染邏輯 =================
  function renderAll() {
    renderHome();
    renderRecord();
    renderPlan();
  }

  function renderHome() {
    // 週期進度
    const cycle = appData.cycle;
    document.getElementById('cycle-name-display').innerText = cycle.name;
    document.getElementById('cycle-week-display').innerText = `第 ${cycle.currentWeek} 週 / ${cycle.maxWeeks} 週`;
    document.getElementById('cycle-progress').style.width = `${(cycle.currentWeek / cycle.maxWeeks) * 100}%`;

    // 今日課表
    document.getElementById('today-day').innerText = todayDayStr;
    const routineText = appData.routine[todayDayStr] || "今日無安排訓練。";
    document.getElementById('today-routine').innerHTML = routineText.replace(/\n/g, '<br>');

    // 近期紀錄 (顯示最後 3 筆)
    const recentBox = document.getElementById('recent-logs-preview');
    if (appData.logs.length === 0) {
      recentBox.innerHTML = '<div style="color:var(--text-sub);font-size:14px;">尚無訓練紀錄。</div>';
    } else {
      let html = '';
      const recentLogs = [...appData.logs].reverse().slice(0, 3);
      recentLogs.forEach(log => {
        const totalSets = log.sets.length;
        html += `
          <div class="history-item" style="padding: 10px 0;">
            <div class="h-header">
              <span class="h-title">${log.exercise}</span>
              <span class="h-date">${log.date} (W${log.cycleWeek})</span>
            </div>
            <div class="h-details">完成 ${totalSets} 組</div>
          </div>
        `;
      });
      recentBox.innerHTML = html;
    }
  }

  function renderRecord() {
    // 今日已完成
    const todayLogsBox = document.getElementById('today-logs');
    const todayLogs = appData.logs.filter(log => log.date === todayDateStr);
    
    if (todayLogs.length === 0) {
      todayLogsBox.innerHTML = '<div style="color:var(--text-sub);font-size:14px;">今日尚未紀錄任何動作。</div>';
    } else {
      let html = '';
      todayLogs.forEach(log => {
        let setsHtml = '';
        log.sets.forEach((set, idx) => {
          setsHtml += `<span class="h-badge">${set.weight}kg x ${set.reps}</span>`;
        });
        
        html += `
          <div class="history-item">
            <div class="h-header">
              <span class="h-title">${log.exercise}</span>
              <button onclick="deleteLog('${log.id}')" style="background:none;border:none;color:var(--danger);cursor:pointer;">刪除</button>
            </div>
            <div style="margin: 8px 0;">${setsHtml}</div>
            ${log.notes ? `<div style="font-size:12px;color:var(--text-sub);">📝 ${log.notes}</div>` : ''}
          </div>
        `;
      });
      todayLogsBox.innerHTML = html;
    }
  }

  function renderPlan() {
    document.getElementById('cycle-name-input').value = appData.cycle.name;
    loadPlanForDay();
  }

  // ================= 互動邏輯 =================
  
  // 週期管理
  function adjustWeek(change) {
    let newWeek = appData.cycle.currentWeek + change;
    if (newWeek >= 1 && newWeek <= appData.cycle.maxWeeks) {
      appData.cycle.currentWeek = newWeek;
      saveData();
    }
  }

  function updateCycleName() {
    const newName = document.getElementById('cycle-name-input').value;
    if (newName) {
      appData.cycle.name = newName;
      saveData();
      alert("週期名稱已更新");
    }
  }

  function resetCycle() {
    if (confirm("確定要結束當前 10 週週期嗎？進度將重置為第 1 週，你可以重新編排課表。")) {
      appData.cycle.currentWeek = 1;
      saveData();
      switchTab('plan');
    }
  }

  // 課表編排
  function loadPlanForDay() {
    const selectedDay = document.getElementById('plan-day-select').value;
    document.getElementById('plan-day-content').value = appData.routine[selectedDay] || "";
  }

  function savePlanForDay() {
    const selectedDay = document.getElementById('plan-day-select').value;
    const content = document.getElementById('plan-day-content').value;
    appData.routine[selectedDay] = content;
    saveData();
    alert(`${selectedDay} 的課表已儲存！`);
  }

  // 實戰紀錄 (動態組數)
  function addSetRow() {
    const container = document.getElementById('sets-container');
    const row = document.createElement('div');
    row.className = 'set-row';
    row.innerHTML = `
      <input type="number" class="set-weight" placeholder="kg" step="0.5">
      <input type="number" class="set-reps" placeholder="次數">
      <input type="number" class="set-rpe" placeholder="6-10" min="1" max="10">
      <button class="del-btn" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(row);
  }

  function saveWorkout() {
    const exercise = document.getElementById('exercise-name').value;
    const notes = document.getElementById('workout-notes').value;
    
    if (!exercise) {
      alert("請填寫訓練動作名稱！");
      return;
    }

    const setRows = document.querySelectorAll('.set-row');
    let sets = [];
    setRows.forEach(row => {
      const weight = row.querySelector('.set-weight').value;
      const reps = row.querySelector('.set-reps').value;
      const rpe = row.querySelector('.set-rpe').value;
      if (weight && reps) {
        sets.push({ weight, reps, rpe });
      }
    });

    if (sets.length === 0) {
      alert("請至少完整填寫一組的重量與次數！");
      return;
    }

    const log = {
      id: Date.now().toString(),
      date: todayDateStr,
      cycleWeek: appData.cycle.currentWeek,
      exercise: exercise,
      sets: sets,
      notes: notes
    };

    appData.logs.push(log);
    saveData();

    // 清空表單
    document.getElementById('exercise-name').value = '';
    document.getElementById('workout-notes').value = '';
    document.getElementById('sets-container').innerHTML = '';
    addSetRow(); // 預留一行新的
  }

  function deleteLog(id) {
    if (confirm("確定要刪除這筆紀錄嗎？")) {
      appData.logs = appData.logs.filter(log => log.id !== id);
      saveData();
    }
  }

  // 初始化執行
  window.onload = () => {
    addSetRow(); // 載入時先加一行空的輸入框
    renderAll();
  };

</script>
</body>
</html>
