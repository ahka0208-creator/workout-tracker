<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>10週健美訓練紀錄</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e24;
      --primary: #facc15; 
      --primary-dim: rgba(250, 204, 21, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    .header {
      padding: 20px 20px 10px;
      text-align: center;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { margin: 0; font-size: 22px; color: var(--primary); letter-spacing: 1px; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 80px; 
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .card-title { font-size: 18px; margin: 0 0 15px 0; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
    .card-title::before { content: ""; display: inline-block; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

    .cycle-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-sub); }
    .progress-bar { width: 100%; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; margin-bottom: 20px;}
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-sub); }
    input, select, textarea {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 16px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn {
      width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .btn-primary { background: var(--primary); color: #000; box-shadow: 0 4px 15px var(--primary-dim); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }

    /* ========== 實戰紀錄專用樣式 ========== */
    .ex-block {
      background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 12px;
      padding: 15px; margin-bottom: 15px; transition: border-color 0.2s;
    }
    .ex-block.checked { border-color: var(--success); background: rgba(34, 197, 94, 0.05); }

    .ex-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 15px; }
    
    /* 自訂 Tick Checkbox */
    .ex-tick {
      appearance: none; -webkit-appearance: none;
      width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 8px;
      background: rgba(0,0,0,0.3); cursor: pointer; position: relative; flex-shrink: 0;
      transition: all 0.2s; margin-top: 2px;
    }
    .ex-tick:checked { background: var(--success); border-color: var(--success); }
    .ex-tick:checked::after {
      content: "✓"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 18px; font-weight: bold;
    }

    .ex-info { flex: 1; }
    .ex-name { display: block; font-size: 17px; font-weight: bold; color: var(--text-main); margin-bottom: 4px; }
    .ex-target { display: block; font-size: 13px; color: var(--text-sub); }

    .set-row, .plan-row { display: grid; gap: 8px; align-items: center; margin-bottom: 10px; }
    .set-row { grid-template-columns: 1fr 1fr auto; } /* 重量, 次數, 刪除 */
    .plan-row { grid-template-columns: 2fr 1fr 1fr auto; }
    .set-row input, .plan-row input { text-align: center; padding: 10px; font-size: 14px;}
    .plan-row input.p-name { text-align: left; }
    
    .del-btn { background: transparent; border: none; color: var(--danger); font-size: 22px; padding: 5px; cursor: pointer; line-height: 1;}

    /* 歷史紀錄清單 */
    .history-item { border-bottom: 1px solid var(--border); padding: 15px 0; }
    .history-item:last-child { border-bottom: none; }
    .h-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .h-title { font-weight: bold; font-size: 16px; color: var(--primary); }
    .h-date { font-size: 12px; color: var(--text-sub); }
    .h-details { font-size: 14px; color: #cbd5e1; margin: 8px 0; line-height: 1.5; }
    .h-badge { display: inline-block; background: rgba(255,255,255,0.1); color: var(--text-main); padding: 4px 8px; border-radius: 6px; font-size: 13px; margin: 0 5px 5px 0; border: 1px solid rgba(255,255,255,0.05);}

    /* 底部導航欄 */
    .nav-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0 20px;
      z-index: 20;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      color: var(--text-sub); background: none; border: none; font-size: 12px; cursor: pointer; padding: 10px;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 22px; }

    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  </style>
</head>
<body>

<div class="app-container">
  
  <div class="header">
    <h1 id="header-title">10 週週期追蹤</h1>
  </div>

  <div class="content">
    
    <!-- 視圖 1：首頁 (Dashboard) -->
    <div id="view-home" class="view-section active">
      <div class="card">
        <h2 class="card-title">當前週期進度</h2>
        <div class="cycle-header">
          <span id="cycle-name-display">自然健美肌肥大週期</span>
          <span id="cycle-week-display">第 1 週 / 10 週</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="cycle-progress" style="width: 10%;"></div>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-secondary" style="padding: 8px; font-size: 14px;" onclick="adjustWeek(-1)">- 退一週</button>
          <button class="btn btn-secondary" style="padding: 8px; font-size: 14px;" onclick="adjustWeek(1)">+ 進一週</button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">今日訓練預覽</h2>
        <div style="color: var(--text-sub); margin-bottom: 15px;">今天是 <span id="today-day" style="color: var(--primary); font-weight:bold;">星期一</span></div>
        <div id="today-routine" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; font-size: 15px; line-height: 1.6; color: var(--text-main);">
          載入中...
        </div>
        <button class="btn btn-primary" style="margin-top: 15px;" onclick="switchTab('record')">前往打卡紀錄</button>
      </div>
      
      <div class="card">
        <h2 class="card-title">近期日誌</h2>
        <div id="recent-logs-preview"></div>
      </div>
    </div>

    <!-- 視圖 2：實戰紀錄 (Record) -->
    <div id="view-record" class="view-section">
      <div class="card">
        <h2 class="card-title">今日課表 (<span id="record-today-label"></span>)</h2>
        
        <!-- 自動載入的課表動作容器 -->
        <div id="daily-workout-container"></div>
        
        <button class="btn btn-secondary" style="margin-bottom: 25px; border-style: dashed;" onclick="addExtraExercise()">+ 臨時加入其他動作</button>

        <div class="input-group">
          <label style="color: var(--primary); font-weight: bold; font-size: 15px;">💭 今天的感受與備註</label>
          <textarea id="daily-notes" rows="3" placeholder="例如：今日狀態佳，發力順暢；或者尋晚無瞓好，重量下降..."></textarea>
        </div>

        <button class="btn btn-primary" onclick="saveDailyWorkout()" style="font-size: 18px; padding: 18px;">💾 儲存今日訓練</button>
      </div>

      <div class="card">
        <h2 class="card-title">歷史訓練日誌</h2>
        <div id="history-logs"></div>
      </div>
    </div>

    <!-- 視圖 3：週期編排 (Plan) -->
    <div id="view-plan" class="view-section">
      <div class="card">
        <h2 class="card-title">每週課表編排</h2>
        <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 20px;">
          設定你每星期的固定訓練菜單。
        </p>

        <div class="input-group">
          <label>選擇日子</label>
          <select id="plan-day-select" onchange="loadPlanForDay()">
            <option value="星期一">星期一</option>
            <option value="星期二">星期二</option>
            <option value="星期三">星期三</option>
            <option value="星期四">星期四</option>
            <option value="星期五">星期五</option>
            <option value="星期六">星期六</option>
            <option value="星期日">星期日</option>
          </select>
        </div>

        <div class="input-group">
          <label style="margin-bottom: 10px;">該日訓練內容</label>
          <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; margin-bottom: 5px; color: var(--text-sub); font-size: 12px; text-align: center;">
            <div style="text-align: left; padding-left: 5px;">動作名稱</div>
            <div>組數</div>
            <div>次數</div>
            <div></div>
          </div>
          
          <!-- 課表動作列表 -->
          <div id="plan-exercises-container"></div>
          
          <button class="btn btn-secondary" style="margin-top: 10px; border-style: dashed;" onclick="addPlanExerciseRow()">+ 新增一格動作</button>
        </div>
        
        <button class="btn btn-primary" onclick="savePlanForDay()">💾 儲存當日課表</button>
      </div>

      <div class="card" style="border-color: rgba(239, 68, 68, 0.3);">
        <h2 class="card-title" style="color: var(--danger);">週期管理</h2>
        <div class="input-group">
          <label>當前週期名稱</label>
          <input type="text" id="cycle-name-input" value="10週自然健美肌肥大週期">
        </div>
        <button class="btn btn-secondary" style="margin-bottom: 15px;" onclick="updateCycleName()">更新名稱</button>
        
        <button class="btn btn-danger" onclick="resetCycle()">⚠️ 結束當前週期 (重置進度)</button>
      </div>
    </div>

  </div>

  <!-- 底部導航 -->
  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('home')" id="nav-home">
      <span class="nav-icon">📊</span>
      <span>首頁</span>
    </button>
    <button class="nav-item" onclick="switchTab('record')" id="nav-record">
      <span class="nav-icon">🏋️</span>
      <span>紀錄</span>
    </button>
    <button class="nav-item" onclick="switchTab('plan')" id="nav-plan">
      <span class="nav-icon">📅</span>
      <span>編排</span>
    </button>
  </div>

</div>

<script>
  // ================= 數據結構與初始化 =================
  const defaultData = {
    cycle: { name: "10週自然健美肌肥大週期", currentWeek: 1, maxWeeks: 10 },
    routine: {
      "星期一": [
        {name: "槓鈴臥推", sets: "4", reps: "8-12"},
        {name: "上斜啞鈴臥推", sets: "3", reps: "10"},
        {name: "坐姿划船", sets: "4", reps: "10"},
        {name: "滑輪飛鳥", sets: "3", reps: "15"}
      ],
      "星期二": [
        {name: "槓鈴深蹲", sets: "4", reps: "6-8"},
        {name: "羅馬尼亞硬拉", sets: "3", reps: "10"},
        {name: "腿舉", sets: "3", reps: "12"}
      ],
      "星期三": [{name: "休息日", sets: "-", reps: "-"}],
      "星期四": [
        {name: "槓鈴肩推", sets: "4", reps: "8"},
        {name: "引體上升", sets: "4", reps: "力竭"},
        {name: "啞鈴側平舉", sets: "4", reps: "15"}
      ],
      "星期五": [
        {name: "硬拉", sets: "3", reps: "5"},
        {name: "俯身划船", sets: "4", reps: "8"},
        {name: "二頭彎舉", sets: "3", reps: "12"}
      ],
      "星期六": [{name: "核心訓練", sets: "-", reps: "-"}],
      "星期日": [{name: "休息日", sets: "-", reps: "-"}]
    },
    // 新版 Logs 結構：一次紀錄「一天」的所有動作與感受
    logs: [] 
  };

  // 使用 V3 避免與舊版本資料衝突
  let appData = JSON.parse(localStorage.getItem('hypertrophyAppV3')) || defaultData;
  
  const daysMap = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  const todayDate = new Date();
  const todayDayStr = daysMap[todayDate.getDay()];
  const todayDateStr = todayDate.toISOString().split('T')[0];

  function saveData() {
    localStorage.setItem('hypertrophyAppV3', JSON.stringify(appData));
    renderAll();
  }

  // ================= 視圖切換 =================
  function switchTab(tabId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`nav-${tabId}`).classList.add('active');

    const titles = { home: "10 週週期追蹤", record: "實戰訓練紀錄", plan: "週期課表編排" };
    document.getElementById('header-title').innerText = titles[tabId];

    if(tabId === 'record') renderDailyWorkoutForm();
    renderAll();
  }

  function renderAll() {
    renderHome();
    renderHistoryLogs();
    renderPlan();
  }

  // ================= 首頁邏輯 =================
  function renderHome() {
    const cycle = appData.cycle;
    document.getElementById('cycle-name-display').innerText = cycle.name;
    document.getElementById('cycle-week-display').innerText = `第 ${cycle.currentWeek} 週 / ${cycle.maxWeeks} 週`;
    document.getElementById('cycle-progress').style.width = `${(cycle.currentWeek / cycle.maxWeeks) * 100}%`;

    document.getElementById('today-day').innerText = todayDayStr;
    const routine = appData.routine[todayDayStr];
    let routineHtml = '';
    
    if (!routine || routine.length === 0) {
      routineHtml = '今日無安排訓練。';
    } else {
      routine.forEach((ex, idx) => {
        const setsText = (ex.sets && ex.sets !== "-") ? `<span style="color:var(--text-sub); font-size:13px;">(${ex.sets}組 x ${ex.reps})</span>` : "";
        routineHtml += `<div style="margin-bottom: 6px;">${idx + 1}. ${ex.name} ${setsText}</div>`;
      });
    }
    document.getElementById('today-routine').innerHTML = routineHtml;

    // 近期日誌預覽
    const recentBox = document.getElementById('recent-logs-preview');
    if (appData.logs.length === 0) {
      recentBox.innerHTML = '<div style="color:var(--text-sub);font-size:14px;">尚無訓練紀錄。</div>';
    } else {
      let html = '';
      const recentLogs = [...appData.logs].reverse().slice(0, 3);
      recentLogs.forEach(log => {
        html += `
          <div class="history-item" style="padding: 10px 0;">
            <div class="h-header">
              <span class="h-title">${log.date} (W${log.cycleWeek})</span>
            </div>
            <div class="h-details" style="margin: 4px 0;">完成了 ${log.exercises.length} 個動作</div>
            <div style="font-size:12px;color:var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
              ${log.notes || "無備註"}
            </div>
          </div>
        `;
      });
      recentBox.innerHTML = html;
    }
  }

  // ================= 實戰紀錄邏輯 (核心更新) =================
  let tempExerciseCount = 0; // 用於生成唯一的動作區塊 ID

  function renderDailyWorkoutForm() {
    document.getElementById('record-today-label').innerText = todayDayStr;
    const container = document.getElementById('daily-workout-container');
    container.innerHTML = '';
    tempExerciseCount = 0;

    const routine = appData.routine[todayDayStr];
    
    if (!routine || routine.length === 0 || (routine.length === 1 && routine[0].name.includes('休息'))) {
      container.innerHTML = '<div style="color:var(--text-sub); font-size:15px; margin-bottom: 20px; text-align:center;">🗓️ 今日課表安排為休息。你可以直接填寫今日感受，或手動加入動作。</div>';
    } else {
      routine.forEach(ex => {
        addExerciseBlock(ex.name, ex.sets, ex.reps);
      });
    }
    
    // 清空備註
    document.getElementById('daily-notes').value = '';
  }

  // 渲染單個動作的打卡區塊
  function addExerciseBlock(name = "", plannedSets = "", plannedReps = "") {
    tempExerciseCount++;
    const exId = `ex-block-${tempExerciseCount}`;
    
    let targetText = '';
    if(plannedSets && plannedSets !== '-') targetText = `目標: ${plannedSets}組 x ${plannedReps}`;

    const html = `
      <div class="ex-block" id="${exId}">
        <div class="ex-header">
          <input type="checkbox" class="ex-tick" onchange="toggleTickStyle('${exId}')">
          <div class="ex-info">
            <input type="text" class="ex-name-input" value="${name}" placeholder="輸入動作名稱" style="background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0; padding:4px 0; font-size:18px; font-weight:bold; color:var(--text-main); margin-bottom:5px; width:100%;">
            <span class="ex-target">${targetText}</span>
          </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 5px; color: var(--text-sub); font-size: 12px; text-align: center; padding-right:35px;">
          <div>重量 (kg)</div>
          <div>次數 (Reps)</div>
        </div>
        
        <div class="actual-sets-container">
          <!-- 預設給一行輸入 -->
          <div class="set-row">
            <input type="number" class="set-weight" placeholder="kg" step="0.5">
            <input type="number" class="set-reps" placeholder="次">
            <button class="del-btn" onclick="this.parentElement.remove()">×</button>
          </div>
        </div>
        
        <button class="btn btn-secondary" style="padding: 10px; font-size: 14px; margin-top: 5px;" onclick="addActualSetRow('${exId}')">+ 新增一組</button>
      </div>
    `;
    
    document.getElementById('daily-workout-container').insertAdjacentHTML('beforeend', html);
  }

  // 臨時加入新動作
  function addExtraExercise() {
    addExerciseBlock("", "", "");
  }

  // 在指定的動作區塊中增加一組實際輸入列
  function addActualSetRow(blockId) {
    const block = document.getElementById(blockId);
    const container = block.querySelector('.actual-sets-container');
    const row = document.createElement('div');
    row.className = 'set-row';
    row.innerHTML = `
      <input type="number" class="set-weight" placeholder="kg" step="0.5">
      <input type="number" class="set-reps" placeholder="次">
      <button class="del-btn" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(row);
  }

  // 勾選時改變邊框顏色
  function toggleTickStyle(blockId) {
    const block = document.getElementById(blockId);
    const checkbox = block.querySelector('.ex-tick');
    if(checkbox.checked) {
      block.classList.add('checked');
    } else {
      block.classList.remove('checked');
    }
  }

  // 儲存今日整個訓練日誌
  function saveDailyWorkout() {
    const notes = document.getElementById('daily-notes').value.trim();
    const blocks = document.querySelectorAll('.ex-block');
    let completedExercises = [];

    blocks.forEach(block => {
      const isTicked = block.querySelector('.ex-tick').checked;
      const exName = block.querySelector('.ex-name-input').value.trim();
      
      // 收集實際組數
      let actualSets = [];
      block.querySelectorAll('.set-row').forEach(row => {
        const w = row.querySelector('.set-weight').value;
        const r = row.querySelector('.set-reps').value;
        if (w && r) actualSets.push({ weight: w, reps: r });
      });

      // 如果有打 Tick，或者有填寫過實際重量次數，就算作已完成
      if ((isTicked || actualSets.length > 0) && exName !== "") {
        completedExercises.push({
          name: exName,
          sets: actualSets
        });
      }
    });

    if (completedExercises.length === 0 && notes === "") {
      alert("請至少勾選/填寫一個動作，或輸入今日感受！");
      return;
    }

    const dailyLog = {
      id: Date.now().toString(),
      date: todayDateStr,
      cycleWeek: appData.cycle.currentWeek,
      notes: notes,
      exercises: completedExercises
    };

    // 將新日誌加到最前面
    appData.logs.unshift(dailyLog);
    saveData();
    
    alert("✅ 今日訓練已成功記錄！");
    
    // 清空表單並跳轉回首頁看結果
    renderDailyWorkoutForm(); 
    switchTab('home');
  }

  // ================= 歷史紀錄預覽 =================
  function renderHistoryLogs() {
    const logsBox = document.getElementById('history-logs');
    
    if (appData.logs.length === 0) {
      logsBox.innerHTML = '<div style="color:var(--text-sub);font-size:14px;">尚未有任何紀錄。</div>';
      return;
    }

    let html = '';
    appData.logs.forEach(log => {
      let exHtml = '';
      log.exercises.forEach(ex => {
        let setsHtml = ex.sets.map(s => `<span class="h-badge">${s.weight}kg x ${s.reps}</span>`).join('');
        exHtml += `
          <div style="margin-bottom: 8px;">
            <div style="color:var(--text-main); font-size:15px; margin-bottom:4px;">▪️ ${ex.name}</div>
            <div>${setsHtml || '<span style="color:var(--text-sub);font-size:12px;">已打卡 (未記錄重量)</span>'}</div>
          </div>
        `;
      });

      html += `
        <div class="history-item">
          <div class="h-header">
            <span class="h-title">${log.date} (第 ${log.cycleWeek} 週)</span>
            <button onclick="deleteLog('${log.id}')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;">刪除</button>
          </div>
          <div style="background:rgba(0,0,0,0.2); padding:12px; border-radius:10px; margin: 10px 0;">
            ${exHtml}
          </div>
          ${log.notes ? `<div style="font-size:14px;color:var(--primary); line-height:1.5;">💭 感受：${log.notes}</div>` : ''}
        </div>
      `;
    });
    logsBox.innerHTML = html;
  }

  function deleteLog(id) {
    if (confirm("確定要刪除這天的紀錄嗎？")) {
      appData.logs = appData.logs.filter(log => log.id !== id);
      saveData();
    }
  }

  // ================= 課表編排邏輯 =================
  function renderPlan() {
    document.getElementById('cycle-name-input').value = appData.cycle.name;
    loadPlanForDay();
  }

  function loadPlanForDay() {
    const selectedDay = document.getElementById('plan-day-select').value;
    const container = document.getElementById('plan-exercises-container');
    container.innerHTML = '';
    
    const exercises = appData.routine[selectedDay];
    
    if (!exercises || exercises.length === 0) {
      for(let i=0; i<4; i++) addPlanExerciseRow();
    } else {
      exercises.forEach(ex => addPlanExerciseRow(ex.name, ex.sets, ex.reps));
    }
  }

  function addPlanExerciseRow(name = '', sets = '', reps = '') {
    const container = document.getElementById('plan-exercises-container');
    const row = document.createElement('div');
    row.className = 'plan-row';
    row.innerHTML = `
      <input type="text" class="p-name" placeholder="動作名 (如: 深蹲)" value="${name}">
      <input type="text" class="p-sets" placeholder="組" value="${sets}">
      <input type="text" class="p-reps" placeholder="次" value="${reps}">
      <button class="del-btn" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(row);
  }

  function savePlanForDay() {
    const selectedDay = document.getElementById('plan-day-select').value;
    const rows = document.querySelectorAll('.plan-row');
    let exercises = [];
    
    rows.forEach(row => {
      const name = row.querySelector('.p-name').value.trim();
      const sets = row.querySelector('.p-sets').value.trim();
      const reps = row.querySelector('.p-reps').value.trim();
      
      if (name) {
        exercises.push({ name, sets, reps });
      }
    });

    appData.routine[selectedDay] = exercises;
    saveData();
    alert(`✅ ${selectedDay} 的課表已成功儲存！`);
    
    // 如果剛好編輯的是今天，更新 Record 頁面
    if(selectedDay === todayDayStr) {
      renderDailyWorkoutForm();
    }
  }

  // ================= 週期控制 =================
  function adjustWeek(change) {
    let newWeek = appData.cycle.currentWeek + change;
    if (newWeek >= 1 && newWeek <= appData.cycle.maxWeeks) {
      appData.cycle.currentWeek = newWeek;
      saveData();
    }
  }

  function updateCycleName() {
    const newName = document.getElementById('cycle-name-input').value;
    if (newName) {
      appData.cycle.name = newName;
      saveData();
      alert("✅ 週期名稱已更新");
    }
  }

  function resetCycle() {
    if (confirm("確定要結束當前 10 週週期嗎？進度將重置為第 1 週。")) {
      appData.cycle.currentWeek = 1;
      saveData();
      switchTab('plan');
    }
  }

  // 初始化
  window.onload = () => {
    renderDailyWorkoutForm();
    renderAll();
  };

</script>
</body>
</html>
